<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!--
      viewport-fit=cover puts the app under the notch and home indicator, which
      the CSS then pads around. interactive-widget keeps the layout above the
      iOS keyboard instead of letting it cover the field being typed into.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#b4541f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MealHelp" />
    <meta
      name="description"
      content="Plan the week's meals, generate one grocery list, and cook from recipes that all look the same."
    />
    <title>MealHelp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
