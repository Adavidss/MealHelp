name = "mealhelp-fetch"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Who may use this Worker. Leave your MealHelp URL here so it does not become
# an open proxy for anyone who finds the address. Comma-separated.
ALLOWED_ORIGINS = "https://kidsdc.org,https://www.kidsdc.org,http://localhost:3140"

# Where linked phones keep their sealed household blob. Create it once with:
#   npx wrangler kv namespace create HOUSEHOLDS
# then paste the id it prints below. Without this binding the Worker still
# fetches pages; it just answers 501 to sync.
# [[kv_namespaces]]
# binding = "HOUSEHOLDS"
# id = "paste-the-id-wrangler-printed"
